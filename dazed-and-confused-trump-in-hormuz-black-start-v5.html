<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Trump in Hormuz</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071522;font-family:Arial,sans-serif}
#game{display:block;width:100%;height:100%;touch-action:none}
.attack{position:fixed;bottom:20px;width:96px;height:58px;border-radius:16px;border:1px solid rgba(255,255,255,.28);background:rgba(12,38,55,.88);color:#fff;font-weight:bold;font-size:14px;z-index:4;user-select:none;box-shadow:0 5px 18px rgba(0,0,0,.28)}
.attack:active{transform:scale(.94);background:rgba(35,80,105,.95)}
#leftAttack{left:18px}#rightAttack{right:18px}
#ammoBox{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);z-index:3;pointer-events:none;background:rgba(0,15,28,.82);padding:6px 12px;border-radius:10px;border:1px solid rgba(150,220,255,.25);min-width:200px}
#ammoLabel{color:#dff7ff;font-size:10px;font-weight:bold;text-align:center;margin-bottom:4px}
#ammoBarBg{width:100%;height:10px;background:rgba(0,0,0,.45);border-radius:5px;overflow:hidden}
#ammoBarFill{height:100%;width:100%;background:linear-gradient(90deg,#3ecf8e,#7dffb2);border-radius:5px;transition:width .15s linear}
#poopBox{position:fixed;left:50%;bottom:42px;transform:translateX(-50%);z-index:3;pointer-events:none;display:none;background:rgba(0,15,28,.82);padding:5px 12px;border-radius:10px;border:1px solid rgba(180,140,80,.35);min-width:200px}
#poopLabel{color:#e8d4a8;font-size:10px;font-weight:bold;text-align:center;margin-bottom:3px}
#poopBarBg{width:100%;height:9px;background:rgba(0,0,0,.45);border-radius:5px;overflow:hidden}
#poopBarFill{height:100%;width:0%;background:linear-gradient(90deg,#8a6a30,#c4a050);border-radius:5px;transition:width .12s linear}
#legend{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);color:rgba(230,250,255,.7);font-size:10px;z-index:3;pointer-events:none;text-align:center;line-height:1.35;white-space:nowrap}
#stats{position:fixed;left:50%;bottom:2px;transform:translateX(-50%);display:flex;gap:8px;z-index:3;pointer-events:none;font-size:10px;font-weight:bold;white-space:nowrap}
#stats span{background:rgba(0,15,28,.78);padding:3px 8px;border-radius:8px;border:1px solid rgba(150,220,255,.22);color:#e8f6ff}
#stats .enemy-sunk{color:#ff9b9b}#stats .ally-sunk{color:#ffc27a}#stats .ally-pass{color:#8dffb0}#stats .enemy-pass{color:#ff8f8f}
@media(min-width:700px){.attack{width:112px;height:64px;font-size:15px}#stats{font-size:11px;gap:10px}#ammoBox,#poopBox{min-width:220px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="leftAttack" class="attack">◀ Near</button>
<button id="rightAttack" class="attack">Far ▶</button>
<div id="ammoBox"><div id="ammoLabel">Tomahawk Gauge</div><div id="ammoBarBg"><div id="ammoBarFill"></div></div></div>
<div id="poopBox"><div id="poopLabel">Toilet Gauge</div><div id="poopBarBg"><div id="poopBarFill"></div></div></div>
<div id="legend">PC: ← Near &nbsp; → Far &nbsp;|&nbsp; <b>Space = Skip Stage</b> &nbsp;|&nbsp; Mobile: buttons</div>
<div id="stats">
<span class="enemy-sunk">Enemy Sunk <b id="statEnemySunk">0</b></span>
<span class="ally-sunk">Ally Sunk <b id="statAllySunk">0</b></span>
<span class="ally-pass">Ally Passed <b id="statAllyPass">0</b></span>
<span class="enemy-pass">Enemy Passed <b id="statEnemyPass">0</b></span>
</div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=0,H=0,dpr=1;
const PATH={rightX:.88,leftX:.16,peninX:.26,topY:.035,portX:.50,portY:.035,bottomY:1.06,targetY:.50,peninTop:.38,peninBot:.62,playerTowerX:.26,playerTowerY:.50};
const SIZE_DATA={S:{label:"S",size:11,speedMul:1.25},M:{label:"M",size:15,speedMul:1.0},L:{label:"L",size:22,speedMul:0.62}};
const SHIP={minSpeed:70,maxSpeed:145,portStopDuration:3};
let ships=[],nextId=1,spawnTimer=0,score=0,message="",messageTimer=0,attackFlash=0,attackSide="";
let projectiles=[],explosions=[];
let statEnemySunk=0,statAllySunk=0,statAllyPass=0,statEnemyPass=0,allySpawned=0,enemySpawned=0;
const MAX_ALLY=20,MAX_ENEMY=20;
let s3AllyPass=0,s3EnemyPass=0,s3EnemySunk=0;
const AMMO={max:6,current:6,rechargeRate:0.35,cost:1,stage2:false};
const SHELL_DATA={nearFlightTime:1.15,farFlightTime:2.0};
let towerState={player:{hp:100,maxHp:100,cooldown:0}},landRocks=[];
let trumpMood="neutral",trumpMoodTimer=0,trumpTime=0;
let stagePhase="intro",stageTitleTimer=0,stageTitleLabel="";
let introTimer=0;
let secDefPresent=false,secDefTime=0,secDefBubbleTimer=0,secDefBubbleVisible=false;
let treasPresent=false,treasTime=0,treasBubbleTimer=0,treasBubbleVisible=false,endResult=null;
let admiralPresent=false,admiralTime=0,admiralBubble=false,admiralBubbleTimer=0,admiralBubbleText="",admiralDeparting=false,admiralExitProgress=0;
let carrierPresent=false,carrierY=0,carrierLeaving=false,carrierGone=false,carrierReturnTimer=0;
let f35s=[],f35SpawnTimer=0;
let poopGauge=0,poopMax=10,toiletClogged=false,cloggedTimer=0,poopCritical=false;
const POOP_FILL_RATE_S4=0.018,POOP_FILL_RATE_S5=0.35,CLOGGED_LEAVE_TIME=8;
let s5AllyKilledByShahed=0;
let stage4IntroPhase=""; // secdef | trump | rise | done
let stage4IntroTimer=0;
let carrierRiseProgress=0;
let audioCtx=null;

function playFanfare(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    const notes=[196,246.94,293.66,392,493.88,587.33,784];
    notes.forEach((freq,i)=>{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      o.type='sawtooth';
      o.frequency.value=freq;
      g.gain.setValueAtTime(0, now+i*0.12);
      g.gain.linearRampToValueAtTime(0.12, now+i*0.12+0.05);
      g.gain.exponentialRampToValueAtTime(0.001, now+i*0.12+0.8);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now+i*0.12); o.stop(now+i*0.12+0.9);
    });
    // low brass pad
    const o2=audioCtx.createOscillator();
    const g2=audioCtx.createGain();
    o2.type='triangle'; o2.frequency.value=98;
    g2.gain.setValueAtTime(0.08, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now+2.5);
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.start(now); o2.stop(now+2.6);
  }catch(e){}
}

let trucks=[],drones=[],truckSpawnTimer=0;

function updateStatsUI(){document.getElementById("statEnemySunk").textContent=statEnemySunk;document.getElementById("statAllySunk").textContent=statAllySunk;document.getElementById("statAllyPass").textContent=statAllyPass;document.getElementById("statEnemyPass").textContent=statEnemyPass;}
function updateAmmoUI(){const pct=Math.max(0,Math.min(1,AMMO.current/AMMO.max))*100;const el=document.getElementById("ammoBarFill");el.style.width=pct+"%";if(AMMO.current<0.15)el.style.background="linear-gradient(90deg,#8a2020,#c94a4a)";else if(AMMO.current<1.5)el.style.background="linear-gradient(90deg,#c94a4a,#ff8a6a)";else if(AMMO.current<3.5)el.style.background="linear-gradient(90deg,#c9a24a,#ffe08a)";else el.style.background="linear-gradient(90deg,#3ecf8e,#7dffb2)";document.getElementById("ammoLabel").textContent="Tomahawk Gauge  "+AMMO.current.toFixed(1)+" / "+AMMO.max;}
function updatePoopUI(){const box=document.getElementById("poopBox");if(stagePhase==="stage4"||stagePhase==="stage5"||stagePhase==="end")box.style.display="block";else box.style.display="none";const pct=Math.max(0,Math.min(1,poopGauge/poopMax))*100;document.getElementById("poopBarFill").style.width=pct+"%";if(poopCritical){document.getElementById("poopLabel").textContent="CRITICAL — CVN departing!";document.getElementById("poopBarFill").style.background="linear-gradient(90deg,#a01010,#ff3030)";}else if(toiletClogged){document.getElementById("poopLabel").textContent="TOILET CLOGGED!";document.getElementById("poopBarFill").style.background="linear-gradient(90deg,#5a3a10,#8a6020)";}else{document.getElementById("poopLabel").textContent="Toilet Gauge  "+poopGauge.toFixed(1)+" / "+poopMax;document.getElementById("poopBarFill").style.background="linear-gradient(90deg,#8a6a30,#c4a050)";}}
function buildLandRocks(){landRocks=[];const leftLandW=W*0.13,rightLandW=W*0.10;for(let i=0;i<36;i++){const side=i%4;let x,y,r;if(side===0){x=6+Math.random()*leftLandW*.85;y=Math.random()*H;r=2+Math.random()*4;}else if(side===1){x=W-rightLandW+Math.random()*rightLandW*.9;y=Math.random()*H;r=2+Math.random()*4;}else if(side===2){x=Math.random()*W;y=5+Math.random()*H*.03;r=2+Math.random()*3;}else{x=Math.random()*W;y=H*.96+Math.random()*H*.03;r=2+Math.random()*3;}landRocks.push({x,y,r});}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);buildLandRocks();if(carrierPresent&&!carrierLeaving)carrierY=H*0.42;}
addEventListener("resize",resize);const px=v=>v*W,py=v=>v*H;

function pickShipConfig(){if(Math.random()<0.12)return{kind:"lng",sizeKey:"L",faction:Math.random()<0.55?"enemy":"ally"};const r=Math.random();return{kind:"tanker",sizeKey:r<0.35?"S":r<0.7?"M":"L",faction:Math.random()<0.5?"enemy":"ally"};}
function createShip(){const cfg=pickShipConfig(),sd=SIZE_DATA[cfg.sizeKey],speed=(SHIP.minSpeed+Math.random()*(SHIP.maxSpeed-SHIP.minSpeed))*sd.speedMul;let color,pattern;if(cfg.kind==="lng"){if(cfg.faction==="enemy"){color="#3aa8d4";pattern="lng";}else{color="#9ad8f0";pattern="stripe";}}else if(cfg.faction==="enemy"){color=cfg.sizeKey==="L"?"#2d9a5c":cfg.sizeKey==="M"?"#39b86d":"#4ecf80";pattern="solid";}else{color=["#4aa879","#d5a84c","#d76b63"][Math.floor(Math.random()*3)];pattern="stripe";}return{id:nextId++,x:px(PATH.rightX),y:py(1.05),state:"MOVING_RIGHT_EDGE_UP",portTimer:0,faction:cfg.faction,kind:cfg.kind,sizeKey:cfg.sizeKey,shipSize:sd.size,color,pattern,alive:true,hitFlash:0,speed,edgeOffset:(Math.random()-.5)*W*.06};}
function spawnShip(){if(allySpawned>=MAX_ALLY&&enemySpawned>=MAX_ENEMY)return;for(let a=0;a<12;a++){const s=createShip();if(s.faction==="ally"&&allySpawned>=MAX_ALLY)continue;if(s.faction==="enemy"&&enemySpawned>=MAX_ENEMY)continue;if(s.faction==="ally")allySpawned++;else enemySpawned++;ships.push(s);return;}}
function moveToward(s,tx,ty,dt){const dx=tx-s.x,dy=ty-s.y,dist=Math.hypot(dx,dy),step=s.speed*dt;if(dist<=step){s.x=tx;s.y=ty;return true;}s.x+=dx/dist*step;s.y+=dy/dist*step;return false;}
function impactPointForShip(s,side){const ty=py(PATH.targetY);if(side==="right")return{x:px(PATH.rightX)+s.edgeOffset,y:ty};return{x:px(PATH.peninX)+12+Math.abs(s.edgeOffset)*.35,y:ty};}
function setTrumpMood(mood){trumpMood=mood;trumpMoodTimer=2.2;}
function onPlayerKillEnemy(){if(stagePhase==="stage4"||stagePhase==="stage5"){poopGauge=Math.max(0,poopGauge-1.5);if(poopGauge<poopMax*0.9){toiletClogged=false;poopCritical=false;cloggedTimer=0;if(!carrierGone)admiralBubble=false;}updatePoopUI();}}
function sinkShip(s,fromChain,byF35){if(!s.alive)return;s.alive=false;s.hitFlash=.55;if(s.faction==="enemy"){score+=s.kind==="lng"?200:100;statEnemySunk++;if(stagePhase==="stage3")s3EnemySunk++;message=s.kind==="lng"?"Enemy LNG BOOM! +200":"Enemy Sunk! +100";setTrumpMood("happy");if(!byF35)onPlayerKillEnemy();}else{score=Math.max(0,score-(s.kind==="lng"?250:150));statAllySunk++;message=s.kind==="lng"?"Ally LNG BOOM! -250":"Ally Sunk! -150";setTrumpMood("pain");}messageTimer=1.1;updateStatsUI();if(s.kind==="lng"){explosions.push({x:s.x,y:s.y,life:0.9,maxLife:0.9});ships.forEach(o=>{if(!o.alive||o.id===s.id)return;if(Math.hypot(o.x-s.x,o.y-s.y)<95)sinkShip(o,true,byF35);});if(!fromChain)message=s.faction==="enemy"?"Enemy LNG Chain!":"Ally LNG Chain!";}}
function updateProjectiles(dt){projectiles.forEach(p=>{p.life-=dt;const progress=Math.min(1,1-p.life/p.maxLife);p.x=p.startX+(p.tx-p.startX)*progress;p.y=p.startY+(p.ty-p.startY)*progress;if(p.life<=0&&!p.resolved){p.resolved=true;let hit=null,best=32;ships.forEach(s=>{if(!s.alive)return;if(p.side==="right"){if(!(s.state==="MOVING_RIGHT_EDGE_UP"||s.state==="MOVING_TO_PORT"))return;}else{if(!(s.state==="MOVING_LEFT_EDGE_DOWN"||s.state==="MOVING_AROUND_PENIN"||s.state==="MOVING_LEFT_AFTER_PENIN"||s.state==="MOVING_LEFT_EXIT"))return;}const d=Math.hypot(s.x-p.tx,s.y-p.ty);if(d<best){best=d;hit=s;}});if(hit)sinkShip(hit,false,false);else{message="Miss!";messageTimer=.6;}}});projectiles=projectiles.filter(p=>!p.resolved);}
function updateShip(s,dt){switch(s.state){case"MOVING_RIGHT_EDGE_UP":if(moveToward(s,px(PATH.rightX)+s.edgeOffset,py(PATH.topY),dt))s.state="MOVING_TO_PORT";break;case"MOVING_TO_PORT":if(moveToward(s,px(PATH.portX),py(PATH.portY),dt)){s.state="DOCKED_AT_PORT";s.portTimer=SHIP.portStopDuration;}break;case"DOCKED_AT_PORT":s.portTimer-=dt;if(s.portTimer<=0)s.state="MOVING_TO_LEFT_EDGE";break;case"MOVING_TO_LEFT_EDGE":if(moveToward(s,px(PATH.leftX)+s.edgeOffset,py(PATH.topY),dt))s.state="MOVING_LEFT_EDGE_DOWN";break;case"MOVING_LEFT_EDGE_DOWN":if(moveToward(s,px(PATH.leftX)+s.edgeOffset,py(PATH.peninTop),dt))s.state="MOVING_AROUND_PENIN";break;case"MOVING_AROUND_PENIN":if(moveToward(s,px(PATH.peninX)+12+Math.abs(s.edgeOffset)*.35,py(PATH.targetY),dt))s.state="MOVING_LEFT_AFTER_PENIN";break;case"MOVING_LEFT_AFTER_PENIN":if(moveToward(s,px(PATH.leftX)+s.edgeOffset,py(PATH.peninBot),dt))s.state="MOVING_LEFT_EXIT";break;case"MOVING_LEFT_EXIT":if(moveToward(s,px(PATH.leftX)+s.edgeOffset,py(PATH.bottomY),dt)){if(s.faction==="ally"){statAllyPass++;if(stagePhase==="stage3")s3AllyPass++;}else{statEnemyPass++;if(stagePhase==="stage3")s3EnemyPass++;}updateStatsUI();s.alive=false;}break;}if(s.hitFlash>0)s.hitFlash-=dt;}
function attack(side){if(stagePhase==="end"||stagePhase.startsWith("title")||stagePhase==="stage4intro")return;if(AMMO.current<AMMO.cost){message="No Tomahawks!";messageTimer=.5;return;}if(towerState.player.cooldown>0){message="Reloading...";messageTimer=.45;return;}const candidates=ships.filter(s=>{if(!s.alive)return false;if(side==="right")return(s.state==="MOVING_RIGHT_EDGE_UP"||s.state==="MOVING_TO_PORT")&&s.y>H*.1&&s.y<H*.95;return(s.state==="MOVING_LEFT_EDGE_DOWN"||s.state==="MOVING_AROUND_PENIN"||s.state==="MOVING_LEFT_AFTER_PENIN"||s.state==="MOVING_LEFT_EXIT")&&s.y>H*.1&&s.y<H*.95;});if(!candidates.length){message=side==="right"?"Far: no target":"Near: no target";messageTimer=.8;return;}const attackY=H*PATH.targetY;const target=candidates.reduce((a,b)=>Math.abs(a.y-attackY)<Math.abs(b.y-attackY)?a:b);AMMO.current-=AMMO.cost;updateAmmoUI();towerState.player.cooldown=.45;const towerX=px(PATH.playerTowerX),towerY=py(PATH.targetY);const imp=impactPointForShip(target,side);const flightTime=side==="left"?SHELL_DATA.nearFlightTime:SHELL_DATA.farFlightTime;projectiles.push({x:towerX,y:towerY,startX:towerX,startY:towerY,tx:imp.x,ty:imp.y,target:null,life:flightTime,maxLife:flightTime,side});attackFlash=.18;attackSide=side;message=(side==="right"?"Far":"Near")+" Tomahawk fired";messageTimer=.7;}
function bindAttack(id,side){const el=document.getElementById(id);const fire=e=>{e.preventDefault();e.stopPropagation();attack(side);};el.addEventListener("pointerdown",fire,{passive:false});el.addEventListener("click",fire);}
bindAttack("leftAttack","left");bindAttack("rightAttack","right");
function clearWave(){ships=[];projectiles=[];explosions=[];f35s=[];drones=[];trucks=[];allySpawned=0;enemySpawned=0;}
function waveDone(){return allySpawned>=MAX_ALLY&&enemySpawned>=MAX_ENEMY&&ships.length===0&&projectiles.length===0;}
function resetWaveSpawns(){allySpawned=0;enemySpawned=0;spawnTimer=0.3;for(let i=0;i<2;i++)spawnShip();}
function enterStage2(){stagePhase="stage2";secDefPresent=true;secDefTime=0;secDefBubbleVisible=true;secDefBubbleTimer=3.5;AMMO.stage2=true;AMMO.rechargeRate=0.22;AMMO.cost=1.15;clearWave();resetWaveSpawns();message="STAGE 2";messageTimer=1.2;}
function enterStage3(){stagePhase="stage3";treasPresent=true;treasTime=0;treasBubbleVisible=true;treasBubbleTimer=3.5;AMMO.rechargeRate=0.18;AMMO.cost=1.25;s3AllyPass=0;s3EnemyPass=0;s3EnemySunk=0;clearWave();resetWaveSpawns();message="STAGE 3";messageTimer=1.2;}
function enterStage4(){
  stagePhase="stage4intro";
  stage4IntroPhase="secdef";
  stage4IntroTimer=3.5;
  secDefPresent=true; secDefTime=0;
  secDefBubbleVisible=true; secDefBubbleTimer=4;
  admiralPresent=false;
  carrierPresent=false; carrierY=H+80; carrierLeaving=false; carrierGone=false;
  carrierRiseProgress=0;
  f35SpawnTimer=4;
  poopGauge=0; toiletClogged=false; poopCritical=false; cloggedTimer=0;
  updatePoopUI();
  AMMO.rechargeRate=0.20; AMMO.cost=1.2;
  clearWave();
  allySpawned=0; enemySpawned=0; ships=[];
  message=""; messageTimer=0;
  playFanfare();
}
function beginStage4Combat(){
  stagePhase="stage4";
  stage4IntroPhase="done";
  admiralPresent=true; admiralTime=0;
  carrierPresent=true; carrierY=H*0.42;
  resetWaveSpawns();
  message="STAGE 4 — F-35 Support"; messageTimer=1.5;
}
function enterStage5(){stagePhase="stage5";truckSpawnTimer=1.0;s5AllyKilledByShahed=0;clearWave();resetWaveSpawns();if(!carrierPresent){carrierPresent=true;carrierY=H*0.42;admiralPresent=true;admiralExitProgress=0;}if(carrierGone){carrierGone=false;carrierLeaving=false;carrierY=H*0.42;poopGauge=0;toiletClogged=false;}message="STAGE 5 — Shahed Threat";messageTimer=1.5;spawnTruck();}
function evaluateEnd(){stagePhase="end";const s3Passed=s3AllyPass+s3EnemyPass;endResult=(s3Passed>=27&&statEnemySunk>=8)?"SUCCESS":"FAIL";}
function skipStage(){if(stagePhase==="end")return;if(stagePhase==="wave1"||stagePhase==="title2"){stagePhase="title2";stageTitleTimer=0;enterStage2();}else if(stagePhase==="stage2"||stagePhase==="title3"){stagePhase="title3";stageTitleTimer=0;enterStage3();}else if(stagePhase==="stage3"||stagePhase==="title4"){stagePhase="title4";stageTitleTimer=0;enterStage4();}else if(stagePhase==="stage4intro"||stagePhase==="stage4"||stagePhase==="title5"){if(stagePhase==="stage4intro"){beginStage4Combat();}else{stagePhase="title5";stageTitleTimer=0;enterStage5();}}else if(stagePhase==="stage5"){clearWave();evaluateEnd();}message="Stage skipped (Space)";messageTimer=1;}
addEventListener("keydown",e=>{if(e.repeat)return;if(e.key==="ArrowLeft")attack("left");if(e.key==="ArrowRight")attack("right");if(e.key===" "||e.code==="Space"){e.preventDefault();skipStage();}});
function carrierHome(){return{x:W*0.50,y:carrierY};}
function spawnF35(){if(toiletClogged||carrierGone||carrierLeaving||f35s.length>=2)return;const home=carrierHome();f35s.push({x:home.x,y:home.y-10,state:"seek",target:null,life:18,heading:0});}

  }
}if(stagePhase==="stage4"||stagePhase==="stage5"){updatePoopSystem(dt);f35SpawnTimer-=dt;if(f35SpawnTimer<=0){spawnF35();f35SpawnTimer=7+Math.random()*5;}updateF35s(dt);}if(stagePhase==="stage5"){truckSpawnTimer-=dt;if(truckSpawnTimer<=0){spawnTruck();truckSpawnTimer=6+Math.random()*4;}updateTrucks(dt);updateDrones(dt);}if(stagePhase==="wave1"&&waveDone()){stagePhase="title2";stageTitleLabel="STAGE 2";stageTitleTimer=2.5;}else if(stagePhase==="title2"){stageTitleTimer-=dt;if(stageTitleTimer<=0)enterStage2();}else if(stagePhase==="stage2"&&waveDone()){stagePhase="title3";stageTitleLabel="STAGE 3";stageTitleTimer=2.5;}else if(stagePhase==="title3"){stageTitleTimer-=dt;if(stageTitleTimer<=0)enterStage3();}else if(stagePhase==="stage3"&&waveDone()){stagePhase="title4";stageTitleLabel="STAGE 4";stageTitleTimer=2.5;}else if(stagePhase==="title4"){stageTitleTimer-=dt;if(stageTitleTimer<=0)enterStage4();}else if(stagePhase==="stage4"&&waveDone()){stagePhase="title5";stageTitleLabel="STAGE 5";stageTitleTimer=2.5;}else if(stagePhase==="title5"){stageTitleTimer-=dt;if(stageTitleTimer<=0)enterStage5();}else if(stagePhase==="stage5"&&waveDone())evaluateEnd();ships.forEach(s=>updateShip(s,dt));ships=ships.filter(s=>s.alive);towerState.player.cooldown=Math.max(0,towerState.player.cooldown-dt);updateProjectiles(dt);explosions.forEach(e=>e.life-=dt);explosions=explosions.filter(e=>e.life>0);if(trumpMoodTimer>0){trumpMoodTimer-=dt;if(trumpMoodTimer<=0)trumpMood="neutral";}if(messageTimer>0)messageTimer-=dt;if(attackFlash>0)attackFlash-=dt;drawBackground();drawPort();drawCarrier();drawAttackEffect();drawTowerStatus(px(PATH.playerTowerX),py(PATH.playerTowerY),towerState.player,"PLAYER");ships.forEach(drawShip);trucks.forEach(drawTruck);f35s.forEach(drawF35);drones.forEach(drawDrone);drawProjectiles();explosions.forEach(e=>{const t=1-e.life/e.maxLife,r=20+t*90,a=Math.max(0,1-t);ctx.save();ctx.globalAlpha=a*.85;const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,r);g.addColorStop(0,"#fff6c8");g.addColorStop(.35,"#ff9a3c");g.addColorStop(.7,"#ff4a2a");g.addColorStop(1,"rgba(255,80,40,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fill();ctx.restore();});drawTreasury();drawTrumpDot();drawSecDef();drawAdmiral();drawStage4IntroText();drawStage3Mission();drawStageTitle();drawEndScreen();drawHUD();drawGameTitle();requestAnimationFrame(loop);}
resize();for(let i=0;i<2;i++){spawnShip();ships[i].y=py(1.05-i*.22);}updateStatsUI();updateAmmoUI();updatePoopUI();requestAnimationFrame(loop);
